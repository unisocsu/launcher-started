plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'kernel.unisocsu.kosherlauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'kernel.unisocsu.kosherlauncher'
        minSdk 19
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}